<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slate — Pre-production</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232B2F33'/%3E%3Cg fill='%23E8E6E0'%3E%3Cg transform='rotate(-10 8 22)'%3E%3Cpolygon points='8,14 22,14 18,22 8,22'/%3E%3Cpolygon points='27,14 39,14 35,22 23,22'/%3E%3Cpolygon points='44,14 56,14 56,22 40,22'/%3E%3C/g%3E%3Cpath d='M8 28.5a2.5 2.5 0 0 1 2.5-2.5h43a2.5 2.5 0 0 1 2.5 2.5V35H8z'/%3E%3Cpath d='M8 37h48v16.5a2.5 2.5 0 0 1-2.5 2.5h-43A2.5 2.5 0 0 1 8 53.5z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* slate brand: Slate #2B2F33 ink, Chalk #E8E6E0, Marker #E3B341 for highlights only (never as text on light).
   Schibsted Grotesk for the interface; screenplay data stays in Courier Prime. */
:root{--slate:#2B2F33;--chalk:#E8E6E0;--marker:#E3B341;--dim:#A9ADB1;--side2:#353A3F;
  --bg:#F5F4F0;--panel:#fff;--line:#DCD9D2;--text:var(--slate);--muted:#5E6268;--accent:var(--slate);--soft:#FBF0CF;--danger:#B83A3A;--mono:"Courier Prime",Courier,monospace;
  --fs-1:12px;--fs-2:13px;--fs-3:14px;--fs-4:16px;--fs-5:20px;
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:32px;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-3)/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{min-height:100%}
/* The sidebar is pinned to the window's left edge, top to bottom, however long the page is.
   The page behind it is painted Slate too, so no light strip can ever show under the menu. */
html{background:linear-gradient(90deg,var(--slate) 236px,var(--bg) 236px)}
body{background:transparent}
.app{padding-left:236px;min-height:100vh}
.side{position:fixed;top:0;bottom:0;left:0;width:236px;display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3);background:var(--slate);color:var(--chalk);z-index:2;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px}
.brand svg{width:30px;height:30px;flex:none}
.brand span{font-size:26px;font-weight:600;letter-spacing:-.035em;line-height:1}
.side select{background:var(--side2);color:var(--chalk);border-color:#474C52}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);background:none;border:none;color:var(--chalk);padding:0 var(--s2) 0 var(--s3);min-height:38px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button:hover{background:#ffffff10}
nav button.on{background:#ffffff1f;font-weight:600}
.ico{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .ico{stroke:var(--dim)}
nav button.on .ico{stroke:var(--chalk)}
/* Script's views, nested under it like a sub-menu. */
.subnav{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 14px;padding-left:10px;border-left:1px solid #474C52}
nav button.subv{min-height:32px;font-size:var(--fs-2);color:var(--dim);padding:0 10px}
nav button.subv:hover{color:var(--chalk)}
nav button.subv.on{color:var(--chalk);background:#ffffff1f;font-weight:600}
.side :focus-visible{outline-color:var(--marker)}
.side-foot{margin-top:auto;display:grid;gap:var(--s2);padding:var(--s3);background:var(--side2);border-radius:var(--r)}
.side-foot button{background:var(--slate);color:var(--chalk);border-color:#4A4F55}
.side-foot button:hover{border-color:#6B7076}
#saved{font-size:var(--fs-1);color:var(--dim)}
#saved.fail{color:#FF8A80;font-weight:600}
.content{min-width:0}
.top{padding:var(--s4) var(--s4) 0}
h1{margin:0;font:inherit}
#title{font-size:28px;font-weight:600;letter-spacing:-.03em;background:none;border:none;color:var(--text);padding:0;width:100%}
.top p{margin:0;color:var(--muted)}
main{padding:var(--s4)}
@media (max-width:899px){
  html{background:var(--bg)}
  .app{padding-left:0}
  .side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3)}
  .brand span{font-size:22px}.brand svg{width:26px;height:26px}
  #proj{flex:1;width:auto;max-width:220px}
  nav{order:3;flex-direction:row;flex-basis:100%;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .subnav{flex-direction:row;margin:0 4px;padding-left:8px}
  nav button.subv{white-space:nowrap}
  .subnav:not(:has(.on)){display:none} /* on phones, Script's views show only while you're in Script */
  nav .ico{display:none}
  .side-foot{order:2;margin:0;padding:0;background:none;display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);flex-basis:100%;justify-content:flex-end}
  .side-foot button{padding:var(--s1) var(--s2);font-size:var(--fs-2)}
  .top{padding:var(--s3) var(--s3) 0}main{padding:var(--s3)}
}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:var(--s2) var(--s3);cursor:pointer;font:inherit;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:#B9B6AE}
/* Feedback: a press dips, new and moved things flash once, saves tick. Motion means "this just happened". */
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.top{display:flex;gap:var(--s3);align-items:flex-start}
.ttl{flex:1;min-width:0}
.hist{display:flex;gap:var(--s1)}
.hist button{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;color:var(--muted)}
.acts{white-space:nowrap}
.acts .x{min-width:36px}
.flash{animation:flash 1.1s cubic-bezier(.2,.8,.2,1)}
tr.flash td{animation:flashbg 1.1s cubic-bezier(.2,.8,.2,1)}
tr.flash{animation:none}
@keyframes flash{from{box-shadow:0 0 0 3px var(--marker)}to{box-shadow:0 0 0 3px #E3B34100}}
@keyframes flashbg{from{background:#F8E3A3}to{background:#F8E3A300}}
.dropping{outline:2px dashed var(--accent);outline-offset:4px;background:var(--soft)}
tr.done td{color:var(--muted)}
tr.done input[data-k=desc]{text-decoration:line-through;color:var(--muted)}
.prog{display:inline-block;width:120px;height:6px;background:var(--chalk);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#16a34a;border-radius:inherit;transition:width .45s cubic-bezier(.2,.8,.2,1)}
#saved.tick{display:inline-block;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
#saved.tick::before{content:'✓ ';color:var(--marker);font-weight:700}
@keyframes pop{from{transform:scale(.85);opacity:.4}}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:grid;gap:var(--s2);justify-items:center;z-index:50;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:var(--s3);align-items:center;background:var(--slate);color:var(--chalk);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px #00000033;max-width:min(92vw,520px);animation:tin .2s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:tout .14s ease-in forwards}
.toast-undo{background:none;border:none;color:var(--marker);font-weight:600;padding:2px 6px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@keyframes tout{to{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.hist button{padding:6px 8px}}
button.primary{background:var(--slate);color:var(--chalk);border-color:var(--slate)}
button.primary:hover{background:#3A3F44}
button.x{border:none;background:none;color:var(--muted);min-width:44px;min-height:36px}
button.x:hover{color:var(--text)}
input,textarea,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:var(--s2);font:inherit;width:100%}
/* Status pills and the home cards. */
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:var(--fs-1);color:var(--muted);background:var(--panel);white-space:nowrap}
.pill.blue{color:var(--slate);background:var(--chalk);border-color:#D3D1CB}.pill.green{color:#15803d;background:#ecf8f0;border-color:#c9ebd4}
.pill.red{color:#b42323;background:#fdeeee;border-color:#f5cccc}.pill.amber{color:#8a5200;background:#fdf5e6;border-color:#f3dcb0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.hello{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0}
.hello span{background:var(--marker);border-radius:8px;padding:0 8px}
.hello,.card .big{letter-spacing:-.03em}
.sub{font-size:24px;color:var(--muted);margin:2px 0 var(--s4);font-weight:500;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s3)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--s4);margin-bottom:var(--s3);padding:var(--s4)}
.hero .big{font-size:28px}
.mini .strip{cursor:default;display:flex;gap:var(--s2);align-items:baseline}
.mini .strip span{display:inline;margin-left:auto;white-space:nowrap}
.plain{margin-top:40px}
.plain h3{margin:0 0 var(--s1);padding-bottom:var(--s2);border-bottom:1px solid var(--line);font-size:var(--fs-2);color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr);padding:var(--s3)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 var(--s2);font-size:var(--fs-2);color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.card .big{font-size:22px;font-weight:600;margin:0 0 var(--s1);letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.card p{margin:0 0 var(--s3)}
.tasks{list-style:none;margin:0 0 var(--s2);padding:0}
.tasks li{display:flex;align-items:center;gap:var(--s2);padding:7px 0;flex-wrap:wrap;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:none}
input[aria-invalid=true]{border-color:var(--danger)!important}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
table{border-collapse:collapse;width:100%;min-width:960px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:var(--fs-1);padding:var(--s2) var(--s1);border-bottom:1px solid var(--line)}
td{padding:var(--s1) 2px;vertical-align:middle}
tr+tr td{border-top:1px solid var(--line)}
/* Table cells read as text until touched. */
td input:not([type=checkbox]),td select{background:transparent;border-color:transparent}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{background:var(--panel);border-color:var(--accent)}
/* Dense on desktop, finger-sized on touch screens. */
@media (pointer:coarse){button,input:not([type=checkbox]),select{min-height:48px}button.x{min-width:48px}input[type=checkbox]{width:24px;height:24px}}
td input[data-k=num]{font-family:var(--mono);font-weight:700}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s1) var(--s3)}
.bar{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s3);flex-wrap:wrap}
.muted{color:var(--muted)}
/* The script reads as a page, like the call sheet it feeds. */
#script{min-height:75vh;font:var(--fs-3)/1.6 var(--mono);max-width:680px;display:block;padding:var(--s4) var(--s3);background:#fff;color:#1d1b18;border:1px solid var(--line);border-radius:var(--r)}
#script::placeholder{color:#857e72}
@media (min-width:768px){#script{padding:48px 56px}}
.mono,.strip,.sets td:nth-child(2){font-family:var(--mono)}
.empty{color:var(--muted);padding:var(--s4) var(--s1);font-size:var(--fs-4)}
.board{display:flex;gap:var(--s3);overflow-x:auto;align-items:flex-start;padding-bottom:var(--s3)}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:264px;width:264px;padding:var(--s3);min-height:120px}
.col h4{margin:0 0 var(--s2);font-size:var(--fs-3);display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.col h4 > span{display:flex;align-items:center;gap:var(--s1);white-space:nowrap}
/* Day settings stack one per row so native date/time pickers never spill out of the column. */
.col .meta{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s2);margin-bottom:var(--s3)}
.col .meta input,.col .meta select{min-width:0;width:100%}
.strip{border-radius:3px;padding:var(--s2);margin-bottom:var(--s1);cursor:grab;color:#111;font-size:var(--fs-1);border-left:6px solid #0003}
.strip span{display:block;opacity:.7}
.strip.dragging{opacity:.35}
.stripcols{position:relative}.stripcols summary{cursor:pointer;color:var(--muted);font-size:var(--fs-1)}
.stripcols[open]>label{display:flex;align-items:center;gap:6px;font-size:var(--fs-1)}.stripcols input[type=color]{width:32px;height:22px;padding:0;border:none;background:none}
.col .flags{margin:2px 0 6px}.holds{margin:0 0 8px}
.mat td{text-align:center;min-width:48px}.mat th{font-size:var(--fs-1)}
.sets tr.lunch td{font-style:italic;color:var(--muted)}
.col{transition:border-color .12s,background .12s}
.col.over{border-color:var(--accent);background:var(--soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.int-d{background:var(--int-d,#f2f0ea)}.ext-d{background:var(--ext-d,#f3e27a)}.int-n{background:var(--int-n,#8fb3e8)}.ext-n{background:var(--ext-n,#93cf95)}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.flag{font-size:var(--fs-1);line-height:1.6;padding:0 8px;border-radius:999px;background:#f6e7d8;color:#7a3e10}
.sheet{background:#fff;color:#111;padding:var(--s5);border:1px solid var(--line);border-radius:var(--r);max-width:900px}
.sheet table{margin:var(--s2) 0 var(--s3);min-width:0}
.sheet tr+tr td{border-top:none}.sheet th{color:#555;border-color:#ccc}.sheet td{border-bottom:1px solid #eee;padding:var(--s1)}
.sheet h2{margin:0;font-size:var(--fs-5)}.sheet h3{margin:var(--s3) 0 0;font-size:var(--fs-3);text-transform:uppercase;letter-spacing:.08em}
#proj{width:auto;max-width:220px}
/* Segmented control: a Chalk track with a white raised "selected" piece. No yellow fill. */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--chalk)}
.seg button{border:none;border-radius:7px;background:none;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:#fff;color:var(--slate);font-weight:600;box-shadow:0 1px 2px #0000001f}
td textarea{background:transparent;border-color:transparent;resize:vertical}
td textarea:focus{background:var(--panel);border-color:var(--accent)}
.link{background:none;border:none;color:var(--muted);padding:var(--s1);text-decoration:underline;font-size:var(--fs-1)}
.bd{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);margin-bottom:var(--s3)}
.bd h3,.bscene h3{font-size:var(--fs-3);margin:0 0 var(--s1)}
.bdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s2) var(--s3);margin-top:var(--s2)}
.bdgrid label{display:grid;gap:2px;font-size:var(--fs-1);color:var(--muted)}
.bdgrid input{color:var(--text);font-size:var(--fs-3)}
table.rep{min-width:0;max-width:640px}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s3);margin:var(--s2) 0 var(--s5)}
.frame{margin:0}
.fimg{position:relative;display:block}
.guide{position:absolute;inset:0;border-radius:8px;pointer-events:none;box-shadow:inset 0 0 0 1px #fff6;
  background:linear-gradient(90deg,#0000 calc(33.33% - .5px),#fffb 0 calc(33.33% + .5px),#0000 0 calc(66.67% - .5px),#fffb 0 calc(66.67% + .5px),#0000 0),
  linear-gradient(#0000 calc(33.33% - .5px),#fffb 0 calc(33.33% + .5px),#0000 0 calc(66.67% - .5px),#fffb 0 calc(66.67% + .5px),#0000 0)}
.frame img,.frame .ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#eceef2}
.frame .ph{border:1px dashed var(--line);color:var(--muted);position:relative;overflow:hidden}
.ph .sketch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ph span{position:relative;background:#eceef2cc;padding:2px var(--s2);border-radius:6px}
.sketch{color:var(--muted);display:block}
.tip{flex-basis:100%;font-size:var(--fs-1)}
.rh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s3);align-items:start}
.rhcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3)}
.rhroom{margin:0 0 var(--s3)}
.rhframe{margin:0}
.rhframe img,.rhframe .sketch{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#eceef2}
.rhframe figcaption{padding:var(--s2) 0}
.rhcue{font-family:var(--mono);color:var(--muted);margin:0 0 var(--s3)}
.rhbeat{font-family:var(--mono);font-size:var(--fs-5);line-height:1.4;margin:0 0 var(--s3);min-height:4em}
.rhbeat b{display:block;font-size:var(--fs-4)}
.rhbeat i{display:block;font-size:var(--fs-4);font-style:normal;color:var(--muted)}
.rhcard textarea{width:100%}
.rhnav{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s3)}
@media(max-width:1000px){.rh{grid-template-columns:minmax(0,1fr)}}
#sides{display:none}
@media print{body.printsides .app,body.printsides #toasts{display:none!important}body.printsides #sides{display:block}}
.sides{break-after:page;color:#111;font:12pt/1.35 var(--mono)}
.sides:last-child{break-after:auto}
.sides h2{font-size:20pt;margin:0}
.sides h3{font-size:12pt;margin:18pt 0 6pt;padding-top:6pt;border-top:1px solid #999;break-after:avoid}
.sides header p,.sdroom{font-size:10pt;margin:2pt 0}
.sides table{border-collapse:collapse;width:100%;margin:8pt 0;font-size:10pt}
.sides th,.sides td{color:#111;text-align:left;border-bottom:1px solid #bbb;padding:2pt 6pt 2pt 0}
.sd{margin:0 0 7pt;padding-left:26pt;position:relative;break-inside:avoid}
.sd b{display:block}
.sd i{display:block;font-style:normal}
.sd p{margin:0}
.sd small{display:block;font-size:9.5pt}
.sd.me{border-left:4pt solid #111;background:#eee;font-weight:700;padding:3pt 4pt 3pt 22pt;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.sdn{position:absolute;left:3pt;top:3pt;font-size:9pt}
.sdshot{font-size:9.5pt;margin:0 0 3pt;padding-left:26pt}
.sdlines{display:block;height:17pt;border-bottom:1px solid #777}
.frame figcaption{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;padding-top:var(--s1)}
.frame figcaption input{flex:1;min-width:120px;background:transparent;border-color:transparent}
.thumb{width:96px;aspect-ratio:16/9;object-fit:cover;display:block;margin-top:var(--s1);border-radius:2px}
.col .meta select{grid-column:1/-1}
.chip{border-radius:999px;padding:var(--s1) var(--s3);font-family:var(--mono);font-weight:700}
.chip[aria-pressed=true]{background:var(--slate);color:var(--chalk);border-color:var(--slate)}
.split{display:grid;grid-template-columns:minmax(260px,400px) minmax(0,1fr);gap:var(--s4);align-items:start}
@media (max-width:899px){.split{grid-template-columns:minmax(0,1fr)}}
/* The script panel stays put while you scroll the shots, like a script on the desk. */
.scriptref{position:sticky;top:var(--s3);max-height:calc(100vh - 32px);overflow:auto}
.scriptref pre{white-space:pre-wrap;font:var(--fs-2)/1.55 var(--mono);background:#fff;color:#1d1b18;padding:var(--s3) var(--s4);margin:0 0 var(--s3);border:1px solid var(--line);border-radius:var(--r)}
.refs{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:flex-end;margin-bottom:var(--s2)}
.ref{display:grid;justify-items:start}

/* Screenplay pages at true size: 8.5x11in, Courier 12pt, 1.5in left margin. Narrow screens scale them down. */

@media (max-width:1120px){.page{zoom:.75}}
@media (max-width:900px){.page{zoom:.42}}
.tagbar{position:sticky;top:0;z-index:1;background:var(--bg);padding:var(--s2) 0}

.t-vehicles{background:#ffcf99}.t-stunts{background:#ff9b85}.t-sfx{background:#a0e7e5}.t-extras{background:#d6d6d6}
/* Screenplay editor: the same page geometry as print, so line breaks and page breaks match. */
.ed-tools{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;padding:var(--s2) 0;margin-bottom:var(--s3);border-bottom:1px solid var(--line)}

.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:var(--s2) var(--s3);background:var(--panel)}

.menu > div{position:absolute;z-index:5;top:calc(100% + 4px);left:0;display:grid;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:var(--s1);box-shadow:0 8px 24px #00000022}

.ed-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s4);align-items:start}
.ed-wrap.noref{grid-template-columns:minmax(0,1fr) auto}
.ed-col{position:relative;min-width:0;overflow-x:auto;padding-bottom:var(--s5)}
#ed{width:8.5in;margin:0 auto;min-height:11in;padding:1in 1in 1in 1.5in;background:#fff;color:#111;font:12pt/12pt var(--mono);box-shadow:0 1px 2px #0000001a,0 4px 16px #0000000d;outline:none;caret-color:var(--slate)}
.b{position:relative;white-space:pre-wrap;min-height:12pt;margin-top:12pt;width:60ch}

.b.k-scene,.b.k-char,.b.k-trans{text-transform:uppercase}

.b.k-section,.b.k-synopsis,.b.k-noteline,.b.k-title,.b.k-bone{font:500 13px/1.5 "Schibsted Grotesk",sans-serif;color:var(--muted);width:auto}

.ac{position:absolute;z-index:6;display:grid;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #00000022;padding:4px}

function charStats() {
  const lines = S.script.split(/\r?\n/), cls = classify(lines), heads = parseScript(S.script), st = new Map();
  let scene = '', cur = null, hi = 0;
  cls.forEach(c => {
    if (c.type === 'scene') scene = heads[hi++]?.num;
    if (c.type === 'char') {
      cur = c.text.replace(/\s*\(.*?\)\s*$/, '').trim().toUpperCase();
      if (!st.has(cur)) st.set(cur, {lines: 0, words: 0, scenes: new Set()});
      st.get(cur).lines++; st.get(cur).scenes.add(scene);
    } else if (c.type === 'dial' && cur) st.get(cur).words += plain(c.text).split(/\s+/).filter(Boolean).length;
    else if (c.type !== 'paren' && c.type !== 'blank') cur = null;
  });
  return st;
}

// The script as movable pieces: whatever comes first, then one chunk per section or scene.
function chunks(text) {
  const lines = text.split(/\r?\n/), cls = classify(lines), heads = parseScript(text), out = [{kind: 'pre', lines: []}];
  let hi = 0;
  lines.forEach((l, i) => {
    const t = cls[i].type;
    if (t === 'scene') out.push({kind: 'scene', lines: [l], num: heads[hi], n: heads[hi++].num});
    else if (t === 'section') out.push({kind: 'section', lines: [l], text: cls[i].text});
    else out[out.length - 1].lines.push(l);
  });

}

  if (line) { const s = line.trim().match(META)[1]; m.tracks = (s.match(/tracks=([A-C,]*)/)?.[1] || '').split(',').filter(Boolean); m.arc = +(s.match(/arc=(-?\d)/)?.[1] || 0); }
  m.syn = (c.lines.find(l => /^=(?!=)/.test(l.trim())) || '').trim().replace(/^=\s*/, '');
  return m;
}

  c.lines = c.lines.filter(l => !META.test(l.trim()) && !/^=(?!=)/.test(l.trim()));
  const add = [];
  if (m.tracks.length || m.arc) add.push(`[[slate: tracks=${m.tracks.join(',')} arc=${m.arc}]]`);
  if (m.syn.trim()) add.push('= ' + m.syn.trim());

}

// "Film 2 2026-01-02 03-04.slate.json" is not a backup of "Film".
const isBackupOf = (title, file) => file.startsWith(title + ' ') && /^\d{4}-\d\d-\d\d \d\d-\d\d\.slate\.json$/.test(file.slice(title.length + 1));

async function runBackup(force) {

      const w = await (await backupDir.getFileHandle(name + ext, {create: true})).createWritable();
      await w.write(body); await w.close();
    }
    // Keep the 20 newest backups of this project.
    const mine = [];
    for await (const [n] of backupDir.entries()) if (isBackupOf(safeName(), n)) mine.push(n);
    mine.sort().slice(0, -20).forEach(n => { backupDir.removeEntry(n).catch(() => {}); backupDir.removeEntry(n.replace('.slate.json', '.fountain')).catch(() => {}); });

const sceneSig = x => `${x.ie}|${x.loc}|${x.tod}`;
const textHash = t => { let h = 0; for (let i = 0; i < t.length; i++) h = h * 31 + t.charCodeAt(i) | 0; return h; };

const sceneHasWork = s => s.day || s.desc || s.refs?.length || s.block || S.shots.some(x => x.scene === s.id)
  || ELEMENTS.some(([k]) => tagList(s[k]).some(x => !(s.autoEl?.[k] || []).some(a => sameTag(a, x))));
// Numbers shift when scenes are added or moved, so each scene finds its row by what it says, and the number only as a last resort.
function buildScenes() {
  const found = parseScript(S.script), rows = sceneRows(), free = new Set(S.scenes), mine = new Map();
  found.forEach(h => h.hash = textHash(h.text.slice(1).join('\n')));
  [(h, s) => sceneSig(s) === sceneSig(h) && s.hash === h.hash, (h, s) => sceneSig(s) === sceneSig(h) && String(s.num) === h.num,
    (h, s) => sceneSig(s) === sceneSig(h), (h, s) => String(s.num) === h.num].forEach(same => found.forEach(h => {
    if (mine.has(h)) return;
    const s = [...free].find(x => same(h, x));
    if (s) { mine.set(h, s); free.delete(s); }
  }));
  // Rows without a hash were added by hand, so they stay. Others left the script: drop them, or set them aside if they hold work.
  const gone = [...free].filter(s => s.hash !== undefined), nums = new Set(found.map(h => h.num));
  S.scenes = S.scenes.filter(s => !gone.includes(s) || sceneHasWork(s));
  gone.forEach(s => { while (nums.has(String(s.num))) s.num = s.num + ' cut'; nums.add(String(s.num)); });
  for (const h of found) {
    const pages = Math.max(1, Math.round((rows[h.num] || 1) / PER_PAGE * 8)), s = mine.get(h), facts = {num: h.num, ie: h.ie, loc: h.loc, tod: h.tod, pages, hash: h.hash};
    if (s) Object.assign(s, facts);

}

// SCRIPT CAPS → a name as people write it: McDONALD → McDonald, O'BRIEN → O'Brien, MARY-ANNE → Mary-Anne.
// Only "Mc" is a safe prefix: Mack, Macy and Mace are not Mac-names.
const properName = n => n.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\bMc(\w)/g, (m, c) => 'Mc' + c.toUpperCase()).replace(/\b(O|D)'(\w)/g, (m, p, c) => `${p}'${c.toUpperCase()}`);

// Tag text in a scene; a cast tag finds or creates the character in Contacts. Returns true if something was added.
function tagItem(s, k, text) {

    if (!name) return false;
    let p = S.people.find(p => p.type === 'cast' && String(p.role).toUpperCase() === name);
    if (!p) S.people.push(p = {id: uid(), type: 'cast', num: nextNum(S.people.filter(p => p.type === 'cast')), name: '', role: properName(name), phone: '', email: '', call: ''});

        if ((await backupDir.requestPermission({mode: 'readwrite'})) === 'granted') { startBackups(); runBackup(true); }
        return;
      }
      if (!window.showDirectoryPicker) return toast("This browser can't save to a folder automatically. Chrome or Edge can; elsewhere use Export backup.");
      try {
        backupDir = await showDirectoryPicker({mode: 'readwrite', id: 'slate-backups'});
        await imgPut('cfg:backup', backupDir);
        startBackups(); await runBackup(true);
        toast(`Backing up to "${backupDir.name}" every 5 minutes`);
      } catch {}
    })();
    return false;
  },
  print: () => (window.print(), false),
  export: () => {
    (async () => {
      download(safeName() + '.json', 'application/json', await projectBackup());
      toast(`Backup of "${S.title}" downloaded`);
    })();
    return false;
  },
  import: () => (document.getElementById('file').click(), false),
};
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { stopRead(); tab = tb.dataset.tab; return render(); }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act !== 'undo' && b.dataset.act !== 'redo') commit(); // each action is its own undo step, never merged with typing before it
  b.closest('details.menu')?.removeAttribute('open'); // menus close once you pick something
  const r = actions[b.dataset.act](b);
  if (r === 'ui') return render();
  if (r !== false) { save(); render(); }
});

// Ids and strip colours go into the page unescaped, and a backup can come from anyone, so they must be plain.
function backupIsSafe(d) {
  const list = k => Array.isArray(d[k]) ? d[k] : [];
  const ids = [...['scenes', 'shots', 'days', 'people', 'locs', 'av', 'bone', 'snaps'].flatMap(k => list(k).map(x => x?.id)),
    ...list('scenes').map(s => s?.day), ...list('shots').map(s => s?.scene), ...list('days').map(x => x?.locId), ...list('av').map(r => r?.shot)];
  return ids.every(v => v == null || v === '' || /^[\w:-]+$/.test(v)) && Object.values(d.strips || {}).every(c => /^#[0-9a-f]{6}$/i.test(c));
}
// A restored backup becomes a new project, so importing never overwrites anything.
async function importBackup(text) {
  const data = JSON.parse(text);
  if (!['scenes', 'shots', 'days', 'people'].every(k => Array.isArray(data[k]))) throw new Error('not a Slate backup');
  if (!backupIsSafe(data)) throw new Error('this file has been tampered with or damaged, so it was not opened');
  const images = data.images || {};
  delete data.images;
  const restore = async old => { if (!images[old]) return null; const id = uid(); try { await imgPut(id, images[old]); return id; } catch { return null; } };
  for (const sh of data.shots) { const id = sh.img && await restore(sh.img); if (id) sh.img = id; else delete sh.img; }
  for (const s of data.scenes) s.refs = (await Promise.all((s.refs || []).map(restore))).filter(Boolean);
  // Snapshot text gets new keys too. A snapshot whose text isn't in the file can't be used, so it isn't listed.
  const snaps = [];
  for (const s of data.snaps || []) { const text = images['snap:' + s.id]; if (text == null) continue; const id = uid(); await imgPut('snap:' + id, text); snaps.push({...s, id}); }
  data.snaps = snaps;
  data.id = uid();
  projects.push({id: data.id, title: data.title});
  S = Object.assign(blank(), data); tab = 'home'; persist(); resetHistory(); render();
  toast(`Imported "${S.title}" as a new project`);
}
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { await importBackup(await f.text()); } catch (err) { alert('Could not import: ' + err.message); }
});

// One path for picked, dropped and pasted images. target: {t: 'shot' | 'ref', i: id}
async function addImages(files, target) {
  let n = 0;
  try {
    for (const file of (target.t === 'shot' ? files.slice(0, 1) : files).filter(f => f.type.startsWith('image/'))) {
      const url = await shrink(file), id = uid();
      await imgPut(id, url);
      imgCache.set(id, Promise.resolve(url));
      if (target.t === 'shot') S.shots.find(x => x.id === target.i).img = id;
      else (S.scenes.find(x => x.id === target.i).refs ||= []).push(id);
      n++;
    }
  } catch (err) { alert("Couldn't add that image (" + (err.message || err) + '). Use a JPG, PNG or WebP file.'); }
  if (!n) return;
  save();
  fresh = {sel: target.t === 'shot' ? `.frame[data-shot="${target.i}"]` : `.refs[data-scene="${target.i}"]`};
  render();
  toast(target.t === 'shot' ? 'Frame added' : `${n} reference${n > 1 ? 's' : ''} added`, true);
}
let pickFor = null;
document.getElementById('imgfile').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  if (files.length && pickFor) addImages(files, pickFor);
});
const dropTarget = el => el.dataset.shot ? {t: 'shot', i: el.dataset.shot} : {t: 'ref', i: el.dataset.scene};
// Paste a screenshot while a frame (or its caption) has focus.
document.addEventListener('paste', e => {
  const zone = document.activeElement?.closest?.('.frame, .refs'), files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (!zone || !files.length) return;
  e.preventDefault();
  addImages(files, dropTarget(zone));
});

document.getElementById('scriptfile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const text = /\.pdf$/i.test(f.name) ? await pdfToText(f) : /\.fdx$/i.test(f.name) ? fdxToText(await f.text()) : normalizeImport(await f.text());
    if (S.script.trim() && !confirm('Replace the script text with ' + f.name + '? Scenes you already built stay, and re-building updates them.')) return;
    S.script = text; save(); render();
    toast(`Imported ${f.name}`, true);
  } catch (err) { alert('Could not read the script: ' + err.message); }
});

let dragId = null;
const clearOver = keep => document.querySelectorAll('.col.over').forEach(c => c !== keep && c.classList.remove('over'));
let cardDrag = null; // index of the card or act being dragged on the Cards board
document.addEventListener('dragstart', e => {
  const card = e.target.closest?.('.icard, .act');
  if (card) { cardDrag = +card.dataset.ci; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; return; }
  const s = e.target.closest?.('.strip'); if (s) { dragId = s.dataset.sid; s.classList.add('dragging'); }
});
document.addEventListener('dragend', () => {
  clearOver(); cardDrag = null;
  document.querySelectorAll('.dragging, .cover').forEach(x => x.classList.remove('dragging', 'cover'));
});
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragover', e => {
  if (isFileDrag(e)) {
    // Image files from the desktop: light up the frame or reference row under the cursor.
    e.preventDefault();
    const zone = e.target.closest('.frame, .refs');
    document.querySelectorAll('.dropping').forEach(z => z !== zone && z.classList.remove('dropping'));
    zone?.classList.add('dropping');
    e.dataTransfer.dropEffect = zone ? 'copy' : 'none';
    return;
  }
  if (cardDrag !== null) {
    const over = e.target.closest('.icard, .act');
    document.querySelectorAll('.cover').forEach(x => x !== over && x.classList.remove('cover'));
    if (over) { e.preventDefault(); over.classList.add('cover'); }
    return;
  }
  const col = dragId && e.target.closest('.col');
  if (!col) return;
  e.preventDefault();
  clearOver(col); col.classList.add('over');
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelectorAll('.dropping').forEach(z => z.classList.remove('dropping')); });
document.addEventListener('drop', e => {
  if (isFileDrag(e)) {
    e.preventDefault(); // never let a stray drop navigate away from the app
    const zone = e.target.closest('.frame, .refs');
    document.querySelectorAll('.dropping').forEach(z => z.classList.remove('dropping'));
    if (zone) addImages([...e.dataTransfer.files], dropTarget(zone));
    return;
  }
  if (cardDrag !== null) {
    const over = e.target.closest('.icard, .act'), from = cardDrag;
    cardDrag = null;
    if (!over) return;
    e.preventDefault();
    const to = +over.dataset.ci;
    if (to !== from) moveChunk(from, from < to ? to - 1 : to); // drop lands just before the card you dropped on
    return;
  }
  const col = e.target.closest('.col'), moved = S.scenes.find(s => s.id === dragId);
  dragId = null;
  if (!col || !moved) return;
  e.preventDefault();
  const day = col.dataset.day || null, before = e.target.closest('.strip')?.dataset.sid;
  const list = dayScenes(day).filter(s => s !== moved), at = list.findIndex(s => s.id === before);
  list.splice(at < 0 ? list.length : at, 0, moved);
  moved.day = day;
  list.forEach((s, n) => s.order = n);
  save();
  fresh = {sel: `.strip[data-sid="${moved.id}"]`};
  render();
  toast(`Scene ${moved.num} moved to ${day ? 'Day ' + (S.days.findIndex(d => d.id === day) + 1) : 'Unscheduled'}`, true);
});

let shownScene = null;
document.addEventListener('selectionchange', () => {
  const c = caretInfo(), pop = $('#tagpop');
  // Selecting a few words on the page offers "Tag as" right above them.
  const words = c && !c.collapsed ? getSelection().toString() : '';
  if (words.trim() && words.trim().length <= 60 && !words.includes('\n')) {
    const r = c.range.getBoundingClientRect();
    popSel = {text: words.replace(/\s+/g, ' ').trim().replace(/[.,;:!?]+$/, ''), el: c.el};
    pop.hidden = false;
    pop.style.left = Math.max(8, Math.min(r.left + scrollX, scrollX + innerWidth - pop.offsetWidth - 8)) + 'px';
    pop.style.top = (r.top + scrollY - pop.offsetHeight - 8) + 'px';
  } else if (!pop.matches(':hover')) pop.hidden = true;
  if (!c) return;
  // Remember where the cursor is, so redrawing the screen (side panel, undo) puts it back there.
  V.edCaret = {i: [...$('#ed').children].indexOf(c.el), off: c.off};
  if (c.el !== edCur) { edCur = c.el; syncTools(); if (acState.open && acState.el !== c.el) closeAc(); }
  // The Scene panel follows the cursor from scene to scene.
  if (V.ref === 'scene') { const n = currentSceneNum(); if (n !== shownScene) { shownScene = n; updateRefPane(); } }
});
document.addEventListener('keyup', e => { if (e.target.closest?.('#ed') && /^Arrow|^Page/.test(e.key)) typewriter(); });
document.addEventListener('mousedown', e => { if (e.target.closest('#ac button, .palette .pal, #tagpop')) e.preventDefault(); }); // keep the cursor and selection in the script
$('#tagpop').insertAdjacentHTML('beforeend', TAGS.map(([k, l]) => `<button data-act="edtag" data-k="${k}" class="t-${k}">${l}</button>`).join(''));
document.addEventListener('click', e => { const b = e.target.closest('#ac button'); if (b) acceptAc(+b.dataset.ac); });
// Pasting several lines into the editor reads them as Fountain and inserts real elements.
document.addEventListener('paste', e => {
  if (!e.target.closest?.('#ed')) return;
  const text = e.clipboardData.getData('text/plain');
  if (!text) return;
  e.preventDefault();
  if (!/\n/.test(text.trim())) { document.execCommand('insertText', false, text.replace(/\s+/g, ' ')); return; }
  const c = caretInfo(), kids = [...$('#ed').children], i = kids.indexOf(c.el), blocks = edBlocks(), t = blockText(c.el);
  const pasted = textToBlocks(normalizeImport(text, {title: false})).map(b => ({...b, raw: null})), left = {...blocks[i], text: t.slice(0, c.off), raw: null}, right = {...blocks[i], text: t.slice(c.off), raw: null, gap: 1};
  const all = [...blocks.slice(0, i), ...(left.text ? [left] : []), ...pasted, ...(right.text ? [right] : []), ...blocks.slice(i + 1)];
  S.script = withTitle(blocksToText(all)); save();
  V.edCaret = {i: i + (left.text ? 1 : 0) + pasted.length - 1, end: true};
  render();
  toast(`Pasted ${pasted.length} element${pasted.length > 1 ? 's' : ''}`, true);
});
function enterFocus() {
  document.body.classList.add('focusmode');
  document.documentElement.requestFullscreen?.().catch(() => {});
  $('#ed')?.focus();
}
function exitFocus() {
  document.body.classList.remove('focusmode');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('focusmode'); });

// Keyboard: undo/redo, Alt+number for sections, and spreadsheet-style row moves in tables.
document.addEventListener('keydown', e => {
  const t = e.target, mod = e.ctrlKey || e.metaKey, typing = t.matches?.('input:not([type=checkbox]):not([type=range]), textarea, select');
  if (mod && !e.altKey && /^[zy]$/i.test(e.key)) {
    if (typing) return; // inside a field, the browser's own undo handles the text
    e.preventDefault();
    return e.key.toLowerCase() === 'y' || e.shiftKey ? redo() : undo();
  }
  if (e.key === 'Escape' && document.body.classList.contains('focusmode')) return exitFocus();
  // Ctrl+F / Ctrl+H: find & replace in the script (the selection becomes the search).
  if (mod && /^[fh]$/i.test(e.key) && tab === 'script' && V.script === 'screenplay' && !V.raw) {
    e.preventDefault();
    const sel = getSelection().toString().trim();
    if (sel && sel.length < 60 && !sel.includes('\n')) V.fq = sel;
    V.find = true; V.fidx = null; render();
    $('#fq').focus(); $('#fq').select();
    return;
  }
  if (t.id === 'fq' || t.id === 'fr') {
    if (e.key === 'Enter') { e.preventDefault(); return t.id === 'fq' ? findStep(e.shiftKey ? -1 : 1) : actions.frep(); }
    if (e.key === 'Escape') { V.find = false; return render(); }
  }
  if (t.closest?.('#ed') && edKey(e)) return;
  if (tab === 'shots' && V.shots === 'rehearse' && !typing && !mod && (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || (e.key === ' ' && !t.matches?.('button, summary')))) {
    e.preventDefault();
    return rhMove(e.key === 'ArrowLeft' ? -1 : 1);
  }
  if (e.altKey && !mod && /^[1-8]$/.test(e.key)) {
    const k = Object.keys(tabs)[+e.key - 1];
    if (k) { e.preventDefault(); tab = k; render(); }
    return;
  }
  const td = t.closest?.('td');
  if (!td || !t.matches('input, select') || t.type === 'checkbox') return;
  const arrows = t.matches('input:not([list]):not([type=date]):not([type=time])');
  const dir = e.key === 'Enter' ? (e.shiftKey ? -1 : 1) : arrows && e.key === 'ArrowDown' ? 1 : arrows && e.key === 'ArrowUp' ? -1 : 0;
  if (!dir) return;
  e.preventDefault();
  t.dispatchEvent(new Event('change', {bubbles: true})); // run blur-time validation before leaving the cell
  const tr = td.parentElement, col = [...tr.children].indexOf(td), rows = [...tr.parentElement.children].filter(r => r.querySelector('td')), next = rows[rows.indexOf(tr) + dir];
  if (next) { const el = next.children[col]?.querySelector('input, select, textarea'); el?.focus(); el?.select?.(); return; }
  // Enter on the last row starts a new one, cursor in the same column.
  const add = t.closest('table').dataset.add;
  if (dir > 0 && add) {
    actions[add]();
    if (fresh) fresh.sel = fresh.sel.replace(/data-k="[^"]*"/, `data-k="${t.dataset.k}"`);
    save(); render();
  }
});

// Startup: move a pre-projects save into the project list, else open the last project.
const legacy = get('slate-project');
if (!projects.length && legacy) {
  S = Object.assign(blank(), legacy, {id: uid()});
  projects = [{id: S.id, title: S.title}];
  persist(); resetHistory();
  try { if (localStorage.getItem(pkey(S.id))) localStorage.removeItem('slate-project'); } catch {}
} else if (projects.length) {
  openProject((projects.find(p => p.id === get(CUR)) || projects[0]).id);
  persist();
} else newProject();
document.getElementById('i-undo').outerHTML = ICON.undo;
document.getElementById('i-redo').outerHTML = ICON.redo;
try { if (localStorage.getItem('slate-dark')) document.body.classList.add('dark-ed'); } catch {}
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices(); // voices load lazily; ask early so table reads have them
  speechSynthesis.addEventListener('voiceschanged', () => { if (V.ref === 'chars') updateRefPane(); });
}
render();
gcImages();
// Resume folder backups if this browser already has permission; otherwise offer a one-click resume.
imgGet('cfg:backup').then(async h => {
  if (!h) return;
  backupDir = h;
  const p = await h.queryPermission({mode: 'readwrite'});
  if (p === 'granted') startBackups(); else backupUI(p);
}).catch(() => {});
</script>
